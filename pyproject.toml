[project]
name = "canada-labour-pipeline"
version = "0.1.0"
description = "ELT pipeline for Statistics Canada's Labour Force Survey: Python, Postgres, dbt and Airflow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
]
